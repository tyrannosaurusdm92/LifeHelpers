  <title id="title">Ocean Wave Mandala — fillable paint-by-number page</title>
  <desc id="desc">A circular adult-coloring mandala built from rolling waves, sea glass, coral, and sand. Full-color library preview; open the SVG to use the numbered mandala-style worksheet. Click a region to apply its suggested color. Shift-click to clear it.</desc>
  <metadata id="pbn-meta"><![CDATA[{"slug": "ocean-wave-mandala", "title": "Ocean Wave Mandala", "desc": "A circular adult-coloring mandala built from rolling waves, sea glass, coral, and sand.", "tags": ["Pattern", "Water", "Meditative"], "palette": [{"hex": "#f0ebe1", "name": "Foam"}, {"hex": "#143f55", "name": "Deep ocean"}, {"hex": "#1f6680", "name": "Ocean blue"}, {"hex": "#3e8ca0", "name": "Teal"}, {"hex": "#72b4b4", "name": "Sea glass"}, {"hex": "#acd4c4", "name": "Mint foam"}, {"hex": "#d8c16b", "name": "Sand gold"}, {"hex": "#e58a62", "name": "Coral"}, {"hex": "#a95678", "name": "Berry"}, {"hex": "#6c6793", "name": "Violet"}, {"hex": "#f2d7a0", "name": "Shell cream"}], "complexity": "Detailed", "standard": "mandala-v5-reference-based", "preview": "colorized", "canvas": "900x900"}]]></metadata>
