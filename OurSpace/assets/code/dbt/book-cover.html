<!doctype html><html lang="en" data-mode="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>DBT Skills Training · Second Edition</title><style>
:root{--cover-bg:#FFFFFF;--cover-text:#000000;--cyan:#00FFFF;--yellow:#FFF600;--persimmon:#EC5800}
html[data-mode="light"]{color-scheme:light;--cover-bg:#FFFFFF;--cover-text:#000000}
html[data-mode="dark"]{color-scheme:dark;--cover-bg:#000000;--cover-text:#FFFFFF}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--cover-bg);color:var(--cover-text)}
body{display:grid;place-items:center;position:relative}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 12% 14%,rgba(0,255,255,.055),transparent 38%),radial-gradient(circle at 88% 82%,rgba(255,246,0,.04),transparent 35%),repeating-linear-gradient(135deg,transparent 0 92px,rgba(0,255,255,.025) 93px,transparent 95px)}
img{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;position:relative;z-index:1}
@media print{body{background:#FFFFFF}img{break-inside:avoid}}
.book-fallback{box-sizing:border-box;position:relative;z-index:1;min-height:95%;width:min(94%,440px);padding:2rem 1.2rem;background:var(--cover-bg);color:var(--cover-text);border:1.75px solid var(--cyan);border-bottom-color:var(--persimmon);border-radius:8px;display:flex;gap:1.3rem;flex-direction:column;justify-content:center;align-items:center;text-align:center;font:16px/1.35 Georgia,"Times New Roman",serif}
.book-fallback strong{font-size:2rem}.book-fallback span{font-size:1.1rem}
</style></head><body><main class="book-fallback" aria-label="DBT Skills Training Handouts and Worksheets, Second Edition"><strong>DBT Skills Training</strong><span>Handouts &amp; Worksheets</span><small>Second Edition · Marsha M. Linehan</small></main>
<script>(function(){const root=document.documentElement;function apply(mode){mode=mode==="dark"?"dark":"light";root.dataset.mode=mode;root.style.colorScheme=mode}try{const parentMode=window.parent!==window?window.parent.document.documentElement.dataset.colorMode:null;apply(parentMode||localStorage.getItem("ourspace.colorMode.v1")||"light")}catch(_){apply("light")}window.addEventListener("storage",event=>{if(event.key==="ourspace.colorMode.v1")apply(event.newValue)});window.addEventListener("message",event=>{if(event.source===window.parent&&event.data?.type==="dbt:mode")apply(event.data.mode)})})();</script></body></html>
