<!DOCTYPE html>

<html data-profile="william" data-theme="lightning" lang="en">
<head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport"/><meta content="dark light" name="color-scheme"/><title>OurSpace · Welcome Home</title><link href="css/ourspace-core/ourspace.css" rel="stylesheet"/><link href="manifest.webmanifest" rel="manifest"/><link href="https://raw.githubusercontent.com/tyrannosaurusdm92/LifeHelpers/main/OurSpace/assets/images/ourspace-icon-192.png" rel="icon"/></head>
<body>
<nav aria-label="Master site navigation" class="master-nav collapsed" id="masterNav"><div class="master-bar"><button class="master-handle" id="masterHandle" title="Drag master navigation" type="button">✥</button><div class="master-current" id="masterCurrent">OurSpace</div><button aria-expanded="true" aria-label="Collapse master navigation" class="master-toggle" id="masterToggle" title="Collapse navigation" type="button">☰</button></div><div class="master-panel"><div class="nav-row design-only-row"><div class="nav-field"><label for="themeSelect">Choose Profile</label><select aria-label="Switch profile page" id="themeSelect"><option selected="" value="william">William</option><option value="jasper">Jasper</option></select></div></div><div class="nav-field" style="margin-bottom:8px"><label for="routeSearch">Find page</label><input id="routeSearch" placeholder="Page number or type" type="search"/></div><div class="page-routes"><button class="page-route" data-page="portal" type="button"><span>01</span><b>Sign In</b></button><button class="page-route" data-page="retrobuilder" type="button"><span>02</span><b>About / Profile</b></button><button class="page-route" data-page="household" type="button"><span>03</span><b>Household</b></button><button aria-controls="navGroup04Items" aria-expanded="true" aria-label="04 Journal &amp; Diary, expand or collapse Journal and Diary" class="nav-group-toggle" id="navGroup04" type="button"><span>04</span><b>Journal &amp; Diary</b><span aria-hidden="true">▾</span></button><div class="nav-group-children" id="navGroup04Items"><button class="page-route nav-subroute" data-page="journal" type="button"><span>04-A</span><b>Journal</b></button><button class="page-route nav-subroute" data-page="diary" type="button"><span>04-B</span><b>Diary</b></button></div><button class="page-route" data-page="feed" type="button"><span>05</span><b>Feed</b></button><button class="page-route" data-page="skills" type="button"><span>06</span><b>Skills</b></button><button class="page-route" data-page="communication" type="button"><span>07</span><b>Communication</b></button><button class="page-route" data-page="audio" type="button"><span>08</span><b>Audio</b></button><button class="page-route" data-page="visual" type="button"><span>09</span><b>Visual</b></button><button class="page-route" data-page="games" type="button"><span>10</span><b>Games</b></button><button class="page-route" data-page="store" type="button"><span>11</span><b>Store</b></button></div><div class="master-actions"><button class="secondary" id="resetMasterNav" type="button">Reset Nav</button></div></div></nav>
<div class="shell">

<main class="page-frame">
<section aria-labelledby="portal-title" class="site-page layout-portal is-active" data-page-id="portal" id="page-portal"><div class="portal-page-shell"><header class="portal-topbar"><div class="portal-brand"><h2>OurSpace</h2><p>Our little corner of the world.</p></div><div class="portal-top-actions"><button id="portalDownloadAppButton" type="button">Download App</button><button class="portal-hidden danger" id="portalLogoutButton" type="button">Sign Out</button></div></header>
<div class="portal-content">
<section class="portal-landing-grid" id="portalSignedOutView">
<div class="portal-logo-slot"><img alt="OurSpace: a cozy cottage and glowing tree beneath the moon" class="portal-logo-image" src="https://raw.githubusercontent.com/tyrannosaurusdm92/LifeHelpers/main/OurSpace/assets/images/Logo_Ourspace.png"/><p class="portal-logo-caption">A place to live and love authentically.</p></div>
<section class="portal-auth-panel"><header><h3>Welcome home</h3><p class="portal-subtle">Sign in to your space</p></header><form autocomplete="on" class="portal-auth-body" id="portalLoginForm">
<div class="portal-field"><label for="portalUsername">Email or phone number</label><input autocapitalize="none" autocomplete="username" class="portal-input" id="portalUsername" name="username" required="" spellcheck="false" type="text"/></div>
<div class="portal-field"><label for="portalPassword">Password</label><div class="portal-password-wrap"><input autocomplete="current-password" class="portal-input" id="portalPassword" name="password" required="" type="password"/><button aria-pressed="false" class="ghost" id="portalTogglePassword" type="button">Show Password</button></div></div>
<label class="portal-check-row"><input id="portalRememberPassword" type="checkbox"/> Keep me signed in</label>
<div class="portal-auth-links"><button class="ghost" id="portalForgotPassword" type="button">Forgot password?</button></div>
<button class="portal-submit" type="submit">Sign In</button><p aria-live="polite" class="portal-status" id="portalAuthStatus" role="status"></p></form></section></section>
<section class="portal-workspace portal-hidden" id="portalSignedInView"><header><h3>OurSpace</h3><p class="portal-subtle" id="portalSignedInAs"></p></header><div class="portal-welcome"><h3>Your space is waiting.</h3><p>Pick up where you left off.</p><div class="portal-profile-choices"><button class="portal-profile-open" data-profile="william" type="button">William / Dino</button><button class="portal-profile-open" data-profile="jasper" type="button">Jasper / Squishy</button></div></div></section>
<p aria-live="polite" class="portal-install-hint" id="portalInstallHint" role="status"></p></div></div><dialog class="portal-recovery-dialog" id="portalRecovery"><header><h2>Reset your password</h2><button aria-label="Close" id="portalRecoveryClose" type="button">✕</button></header>
<p aria-live="polite" id="portalRecoveryStatus"></p>
<section id="portalRecoveryStepOne"><form id="portalRecoveryStart"><label for="portalRecoveryIdentity">Email or phone number</label><input autocomplete="username" id="portalRecoveryIdentity" name="identifier" required="" type="text"/><button type="submit">Continue</button></form><form hidden="" id="portalRecoveryChoose"><label for="portalRecoveryOptions">Send code to</label><select id="portalRecoveryOptions"></select><button type="submit">Send Code</button></form></section>
<section hidden="" id="portalRecoveryStepTwo"><form id="portalRecoveryVerify"><label for="portalRecoveryCode">Your six-digit code</label><input autocomplete="one-time-code" id="portalRecoveryCode" inputmode="numeric" maxlength="12" name="one-time-code" required="" type="text"/><div class="portal-recovery-actions"><button id="portalRecoveryResend" type="button">Resend Code</button><button type="submit">Continue</button></div></form></section>
<section hidden="" id="portalRecoveryStepThree"><form id="portalRecoveryComplete"><label for="portalRecoveryNewPassword">New password</label><div class="portal-password-wrap"><input autocomplete="new-password" id="portalRecoveryNewPassword" name="new-password" required="" type="password"/><button id="portalRecoveryShowPassword" type="button">Show Password</button></div><button type="submit">Reset Password</button></form></section>
</dialog></section>
</main>
<footer class="footer"><strong id="osSuiteFooterName">OurSpace</strong><span id="osSuiteFooterDescription">A space that belongs to you.</span></footer>
</div>
<script src="js/ourspace-core/backend-client.js"></script><script src="js/ourspace-core/portal.js"></script><script src="js/ourspace-core/profile-routing.js"></script>
</body></html>
